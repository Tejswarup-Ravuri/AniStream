<!Doctype HTML>
<html>
<head>
<title>Forms Page</title>
<!-- <link rel=stylesheet href="style.css"> -->
</head>
<style>
/* .Personal_info {
  border:2px solid rgb(0, 255, 55);
  background-color: rgb(222, 238, 243);
} */
</style>
<body>
    <form>
     <div class="Personal_info">
        <label>Name:</label>
        <input type="text" placeholder="Enter Your Name">
        <label>Email:</label>
        <input type="email" placeholder="Enter your Email:">
        <label>Phone Number:</label>
        <input type="text" placeholder="Enter your Phone Number:" pattern="\d{10}"maxlength="10">
        <label>Age:</label>
        <input type="number" placeholder="Enter your age:" min="1" max="100">
        <label>Birthday:</label>
        <input type="date" placeholder="" max="2025-10-18">
     </div>
     <br>
     <div class="Food">
        <label>Food</label>
        <label>Apple</label>
          <input type="checkbox">
        <label>Orange</label>
          <input type="checkbox">
        <label>Banana</label>
          <input type="checkbox">
     </div>
    <br>
     <div class="Gender">
      <label>Gender</label>
        <label>Male</label>
        <input type="radio">
        <label>Female</label>
        <input type="radio">
    <br>
        <label>Eye Color</label>
        <select>
            <option>Black</option>
            <option>Brown</option>
            <option>Blue</option>
            <option>Green</option>
            <option>White</option>
        </select>
     </div>
    </form>

</body>
</html>
